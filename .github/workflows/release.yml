name: Release.

# Выпуск из уже собранного прогона "Windows.": берет его артефакт,
# упаковывает portable-архив и создает релиз GitHub на том коммите,
# из которого артефакт собран. Пересборки нет.
#
# Описание релиза — release-notes/<tag>.md, если такой файл есть.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'ID успешного прогона "Windows." (число из адреса прогона)'
        required: true
      tag:
        description: 'Тег релиза, например v7.2.10'
        required: true
      prerelease:
        description: 'Пометить как pre-release'
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout.
        uses: actions/checkout@v7
        with:
          sparse-checkout: release-notes

      - name: Source run.
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")"
          name="$(jq -r .name <<<"$run")"
          conclusion="$(jq -r .conclusion <<<"$run")"
          sha="$(jq -r .head_sha <<<"$run")"
          if [ "$name" != "Windows." ] || [ "$conclusion" != "success" ]; then
            echo "::error::Run $RUN_ID is '$name' with conclusion '$conclusion', expected a successful 'Windows.' run."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Release from run $RUN_ID, commit $sha."

      - name: Download artifact.
        uses: actions/download-artifact@v7
        with:
          name: netgram-win64-${{ steps.source.outputs.sha }}
          path: netgram
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Download release files.
        uses: actions/download-artifact@v7
        with:
          name: netgram-release-${{ steps.source.outputs.sha }}
          path: release
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Package.
        id: package
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test -f netgram/netgram.exe
          test -f netgram/Updater.exe
          version="${TAG#v}"
          setup="release/netgram-${version}-win64-setup.exe"
          test -f "$setup" || { echo "::error::$setup not found: the build has no installer (tag and version.h differ?)"; exit 1; }
          test -f release/current6 || { echo "::error::current6 not found: the build has no signed update package (NETGRAM_UPDATE_KEY not set?)"; exit 1; }
          update="$(ls release/tx64upd* | head -n 1)"
          test -n "$update"
          zip="netgram-${version}-win64-portable.zip"
          (cd netgram && zip -9 -r "../$zip" .)
          cp "$setup" .
          setup="$(basename "$setup")"
          sha256sum "$zip" "$setup" > "netgram-${version}-SHA256SUMS.txt"
          cat "netgram-${version}-SHA256SUMS.txt"
          cat release/current6
          {
            echo "zip=$zip"
            echo "setup=$setup"
            echo "update=$update"
            echo "sums=netgram-${version}-SHA256SUMS.txt"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Create release.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ steps.source.outputs.sha }}
          ZIP: ${{ steps.package.outputs.zip }}
          SETUP: ${{ steps.package.outputs.setup }}
          UPDATE: ${{ steps.package.outputs.update }}
          SUMS: ${{ steps.package.outputs.sums }}
          VERSION: ${{ steps.package.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          notes="release-notes/$TAG.md"
          args=(--target "$SHA" --title "netgram $VERSION")
          if [ -f "$notes" ]; then
            args+=(--notes-file "$notes")
          else
            args+=(--notes "netgram $VERSION")
          fi
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          else
            args+=(--latest)
          fi
          # current6 и tx64upd* читает обновлятор установленных копий
          # через releases/latest/download/, поэтому релиз — latest.
          gh release create "$TAG" "$SETUP" "$ZIP" "$SUMS" "$UPDATE" release/current6 "${args[@]}"
